version: 2
updates:
  # Root workspace (pnpm monorepo) - security updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Managed manually via changeset versioning
      - dependency-name: "@sitecore-marketplace-sdk/*"
      # Exact-pinned: the custom generator plugins in packages/shared/plugins use
      # generator internals (@hey-api/openapi-ts, @hey-api/shared), so upgrades
      # need a manual migration (SBB-45474)
      - dependency-name: "@hey-api/*"

  # GitHub Actions - security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"