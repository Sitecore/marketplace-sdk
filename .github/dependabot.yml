version: 2
updates:
  # Root workspace (pnpm monorepo) - security updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Managed manually via changeset versioning
      - dependency-name: "@sitecore-marketplace-sdk/*"
      # Pinned to 0.66.5: the custom generator plugins in packages/shared/plugins
      # use the plugin API removed in later versions (SBB-45474)
      - dependency-name: "@hey-api/openapi-ts"

  # GitHub Actions - security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "major"