version: 2
updates:
  # Root workspace (pnpm monorepo) - minor/patch updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # Managed manually via changeset versioning
      - dependency-name: "@sitecore-marketplace-sdk/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Root workspace (pnpm monorepo) - major updates only, split out for visibility
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "Major Package Update"
    groups:
      major-dependencies:
        patterns:
          - "*"
    ignore:
      # Managed manually via changeset versioning
      - dependency-name: "@sitecore-marketplace-sdk/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # GitHub Actions - minor/patch updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions - major updates only, split out for visibility
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "Major Package Update"
    groups:
      major-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]